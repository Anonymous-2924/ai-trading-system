# Sector map used by the sector-exposure cap.
# Keys are QUOTED on purpose: YAML 1.1 reads bare ON, OFF, YES, NO, TRUE and
# FALSE as booleans, so an unquoted ON (ON Semiconductor) becomes `true` and
# the symbol silently turns into "TRUE". config.py now rejects that outright.  Unmapped symbols fall into
# "unknown", which shares a single bucket — so an unmapped name is treated
# conservatively rather than being exempt from the cap.
sectors:
  "TSLA": consumer_discretionary
  "NVDA": technology
  "PLTR": technology
  "COIN": financials
