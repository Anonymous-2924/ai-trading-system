# ---------------------------------------------------------------------------
# Sample configuration.  Every value here can be overridden by an environment
# variable (see .env.example) or by a CLI flag on scripts/run_trading.py.
#
# Tuning values live HERE and never as MCP tool arguments: CrewAI advertises
# tools in OpenAI strict mode, which forces every declared parameter into
# "required", so an "optional tuning knob" parameter is not expressible.
# ---------------------------------------------------------------------------

run:
  mode: analyse            # analyse | execute
  require_human_approval: true
  demo_mode: false
  # Crew cost is ~2 requests per symbol + 4. The crew now runs TWICE a day,
  # so at 8 symbols three students would need ~120 requests daily. At 6 it
  # is ~16 per student, ~48 per run, ~96 per day.
  max_llm_symbols: 6
  lookback_days: 400       # enough to seed EMA200 and 60-bar statistics
  model_run_dir: model-run
  log_dir: trading-logs

# ---------------------------------------------------------------------------
# AGGRESSION.  The brief says: "You are all young and MUST take risks. A
# conservative or cautious approach will not do."  0.0 is textbook-timid,
# 1.0 is maximally aggressive.  The default of 0.75 is deliberately well above
# the textbook settings; see the README section "Aggression" for the numbers
# each level produces.
# ---------------------------------------------------------------------------
aggression: 0.75

risk:
  starting_equity: 100000.0
  # Position size as a fraction of equity, interpolated by `aggression`
  # between the timid and aggressive ends.
  position_pct_timid: 0.03
  position_pct_aggressive: 0.14
  # Conviction multipliers applied on top of the base position size.
  conviction_multipliers:
    LOW: 0.0               # LOW conviction never opens a position
    MEDIUM: 0.7
    HIGH: 1.0
    VERY_HIGH: 1.35
  max_positions_timid: 8
  max_positions_aggressive: 15
  # Gross exposure as a fraction of equity.  Above 1.0 uses Alpaca paper
  # margin; the paper account grants 2x intraday / 1x overnight on equities.
  max_gross_exposure_timid: 0.60
  max_gross_exposure_aggressive: 1.35
  # No single name above this fraction of equity.
  max_position_pct_timid: 0.08
  max_position_pct_aggressive: 0.22
  # No single sector above this fraction of equity.
  max_sector_pct_timid: 0.25
  max_sector_pct_aggressive: 0.45
  # Stops and targets are ATR multiples, so a volatile name gets a wider stop.
  atr_stop_multiple_timid: 1.5
  atr_stop_multiple_aggressive: 2.8
  atr_target_multiple_timid: 2.5
  atr_target_multiple_aggressive: 6.0
  # Keep this much of the account in cash no matter what.
  min_cash_buffer_pct: 0.02
  # Refuse an order whose notional is below this (commission-free, but
  # fractional dust is noise).
  min_order_notional: 50.0
  # VOLATILITY-ADJUSTED SIZING. Previously every position was the same
  # percentage of equity whether it was PG or MARA, so the jumpy names
  # dominated portfolio risk. Size is now divided by the stock's volatility
  # relative to a reference, so each position contributes roughly equal RISK
  # rather than equal dollars.
  volatility_sizing: true
  # The NATR (daily range as a percent of price) treated as "normal". A stock
  # at this level is sized at 1.0x; one at twice this gets roughly half.
  reference_natr_pct: 3.0
  # Clamps, so a very calm name cannot be scaled up without limit and a very
  # wild one is not scaled to nothing.
  min_volatility_scale: 0.35
  max_volatility_scale: 1.40

  # BRACKET ORDERS. The ATR stop and target are attached to the entry at
  # Alpaca, so they protect the position BETWEEN runs. Previously they were
  # computed and logged but never sent, which meant an overnight gap had
  # nothing standing in its way.
  use_bracket_orders: true
  # Prefer the intraday ATR for the stop when 15-minute bars are available:
  # the daily ATR gives a very wide stop on a high-beta name.
  bracket_use_intraday_atr: true

  # High-beta sleeve: fraction of the book that must sit in S&P High Beta
  # style names.  The brief requires at least 30%.
  min_high_beta_pct: 0.30

signals:
  buy_threshold: 0.18
  sell_threshold: -0.18
  conviction_thresholds:
    medium: 0.22
    high: 0.38
    very_high: 0.55
  dimension_weights:
    trend: 0.28
    momentum: 0.24
    volume: 0.14
    volatility: 0.12
    statistics: 0.12
    sentiment: 0.10
  # MACD's share of the whole composite, split 60% to the LINE (a TREND
  # statement) and 40% to the HISTOGRAM (a MOMENTUM statement).
  macd_budget: 0.10

sentiment:
  enabled: true
  lookback_hours: 48
  max_articles_per_symbol: 12
  # Headlines are scored by a transparent lexicon, NOT invented.  With no
  # credentials and no demo mode the system returns "no data" rather than
  # fabricating a headline.
  neutral_on_no_news: true

llm:
  provider: ollama_cloud   # ollama_cloud | ollama_local | groq | openai_compatible | none
  model: gpt-oss:120b
  temperature: 0.2
  max_retries: 8           # free tiers return 429; honour Retry-After
  timeout_seconds: 180
  # HARD wall-clock budget for the whole agent crew, per student. When the
  # free tier rate-limits, 8 retries x 180s can outlast the CI job's own
  # timeout, and the job is then killed before it can write its daily-log
  # row. Exceeding this budget abandons the crew and falls back to the rule
  # engine, so a run always finishes and always logs.
  crew_budget_seconds: 420
  # When the LLM is unavailable, unauthorised, rate-limited or returns empty
  # content, fall back to the deterministic rule engine.  Every fallback is
  # announced loudly — never silently.
  fallback_to_rule_engine: true

