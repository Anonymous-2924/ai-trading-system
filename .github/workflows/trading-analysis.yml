name: Trading analysis

# ---------------------------------------------------------------------------
# Scheduled on weekdays, plus manual dispatch.
#
# ORDER SUBMISSION: only mode=execute sets REQUIRE_HUMAN_APPROVAL=false, and
# BOTH are required before a single order leaves the runner.
#
#   Morning and afternoon crons  -> execute. THESE PLACE REAL PAPER ORDERS.
#                                   Set the repository variable
#                                   SCHEDULED_MODE=analyse to stop that
#                                   without touching this file.
#   End-of-day snapshot cron     -> analyse. Records closing equity only.
#   Manual dispatch              -> whatever the human picks (default
#                                   analyse, so a stray click cannot trade).
#
# The decision is made in ONE place, the "Decide the run mode" step below.
# ---------------------------------------------------------------------------

on:
  schedule:
    # ---------------------------------------------------------------------
    # THREE fixed crons, but the TIME WE ACT is decided at runtime by asking
    # Alpaca when the session actually opens and closes
    # (scripts/await_market_window.py). Two reasons a fixed UTC cron cannot
    # do this on its own:
    #
    #   1. The US close moves an hour when the clocks change on 1 November,
    #      so "30 minutes before the close" is 19:30 UTC in summer and
    #      20:30 UTC in winter.
    #   2. GitHub's scheduler is best-effort; we have measured a delay of
    #      over three hours.
    #
    # So each cron fires EARLY and the job waits for its real target:
    #
    #   14:00 UTC -> waits until 10:05 ET  (35 min after the open: the
    #                09:30-09:45 opening range has formed and settled past
    #                the data delay, and we are inside the opening power
    #                hour rather than in the opening auction)
    #   19:25 UTC -> waits until 15:30 ET  (30 min before the close, in the
    #                closing power hour)
    #
    # In IST that is about 19:30 and 00:55. Both avoid the 11:30-13:30 ET
    # midday lull entirely.
    # ---------------------------------------------------------------------

    # Morning trading run.
    - cron: "0 14 * * 1-5"

    # Afternoon trading run.
    - cron: "25 19 * * 1-5"

    # Closing-equity snapshot. No AI, no orders, zero LLM quota — it exists
    # only so the daily log records the true closing equity.
    - cron: "30 21 * * 1-5"

  workflow_dispatch:
    inputs:
      mode:
        description: "analyse = recommendations only; execute = submit paper orders"
        type: choice
        options: [analyse, execute]
        default: analyse
      students:
        description: "Comma-separated student ids, or 'all'"
        type: string
        default: all
      model:
        description: "LLM model id (blank = the config default)"
        type: string
        default: ""
      max_llm_symbols:
        description: "Symbol cap for the agent crew (~2 requests per symbol + 4)"
        type: string
        default: "12"
      aggression:
        description: "0.0 timid .. 1.0 maximal"
        type: string
        default: "0.75"

permissions:
  contents: write

concurrency:
  # One run at a time PER SCHEDULE, not across all of them. A single shared
  # group meant a delayed trading run was still going when the evening
  # snapshot fired, so the snapshot queued behind it and the backlog grew.
  # A manual dispatch gets its own group and is never made to wait.
  group: trading-${{ github.event.schedule || github.run_id }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  CONFIG_PATH: config/config.yaml

jobs:
  analyse:
    name: ${{ matrix.student }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # Each student uses its OWN Alpaca account, and the free LLM tier caps
      # tokens per minute — parallel jobs would exhaust it instantly.
      max-parallel: 1
      fail-fast: false
      matrix:
        student: [student_1, student_2, student_3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # --ignore-installed PyYAML works around the Debian/Ubuntu PyYAML
          # RECORD error that otherwise aborts the install.
          pip install --ignore-installed PyYAML -r requirements.txt

      - name: Select this student's secrets
        id: creds
        env:
          KEY_1: ${{ secrets.ALPACA_API_KEY_1 }}
          SECRET_1: ${{ secrets.ALPACA_SECRET_KEY_1 }}
          KEY_2: ${{ secrets.ALPACA_API_KEY_2 }}
          SECRET_2: ${{ secrets.ALPACA_SECRET_KEY_2 }}
          KEY_3: ${{ secrets.ALPACA_API_KEY_3 }}
          SECRET_3: ${{ secrets.ALPACA_SECRET_KEY_3 }}
        run: |
          case "${{ matrix.student }}" in
            student_1) KEY="$KEY_1"; SECRET="$SECRET_1" ;;
            student_2) KEY="$KEY_2"; SECRET="$SECRET_2" ;;
            student_3) KEY="$KEY_3"; SECRET="$SECRET_3" ;;
            *) KEY=""; SECRET="" ;;
          esac

          # Strip whitespace: a key pasted into the secrets UI with a trailing
          # newline is rejected by Alpaca as invalid.
          KEY="$(printf '%s' "$KEY" | tr -d '[:space:]')"
          SECRET="$(printf '%s' "$SECRET" | tr -d '[:space:]')"

          if [ -z "$KEY" ] || [ -z "$SECRET" ]; then
            echo "::warning title=Skipping ${{ matrix.student }}::No Alpaca secrets configured (ALPACA_API_KEY_N / ALPACA_SECRET_KEY_N). Skipping this student rather than failing the run."
            echo "has_creds=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Mask BEFORE exporting, so nothing can echo them into the log.
          echo "::add-mask::$KEY"
          echo "::add-mask::$SECRET"
          echo "ALPACA_API_KEY=$KEY" >> "$GITHUB_ENV"
          echo "ALPACA_SECRET_KEY=$SECRET" >> "$GITHUB_ENV"
          echo "has_creds=true" >> "$GITHUB_OUTPUT"

      - name: Mask the LLM key
        if: steps.creds.outputs.has_creds == 'true'
        env:
          OLLAMA_RAW: ${{ secrets.OLLAMA_API_KEY }}
        run: |
          OLLAMA_KEY="$(printf '%s' "$OLLAMA_RAW" | tr -d '[:space:]')"
          if [ -n "$OLLAMA_KEY" ]; then
            echo "::add-mask::$OLLAMA_KEY"
            echo "OLLAMA_API_KEY=$OLLAMA_KEY" >> "$GITHUB_ENV"
          else
            echo "::warning title=No LLM key::OLLAMA_API_KEY is not set. The run will use the deterministic rule engine, and the fallback will be announced in the output."
          fi

      - name: Check the model can drive the crew
        if: steps.creds.outputs.has_creds == 'true'
        continue-on-error: true
        env:
          LLM_PROVIDER: ollama_cloud
          LLM_MODEL: ${{ inputs.model }}
        run: |
          # ~1 minute. Never fails the job: the rule engine runs regardless.
          [ -n "$LLM_MODEL" ] || unset LLM_MODEL
          python scripts/test_llm.py --timeout 20 || \
            echo "::warning title=LLM check failed::The run will fall back to the deterministic rule engine."

      - name: Wait for the right point in the session
        id: window
        if: steps.creds.outputs.has_creds == 'true' && github.event_name == 'schedule'
        env:
          FIRED_SCHEDULE: ${{ github.event.schedule }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          DEMO_MODE: "false"
        run: |
          # The snapshot does not care where we are in the session.
          if [ "$FIRED_SCHEDULE" = "30 21 * * 1-5" ]; then
            echo "snapshot run; no waiting required."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          case "$FIRED_SCHEDULE" in
            "0 14 * * 1-5")  WINDOW=open  ;;
            "25 19 * * 1-5") WINDOW=close ;;
            *)               WINDOW=close ;;
          esac

          # 70 minutes covers the worst case: a cron placed to suit US
          # daylight time has to wait an extra hour once the clocks change.
          set +e
          python scripts/await_market_window.py --window "$WINDOW" --max-wait 4200
          STATUS=$?
          set -e

          if [ "$STATUS" -eq 0 ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          elif [ "$STATUS" -eq 10 ]; then
            echo "::notice title=Window missed::Not a usable point in the session (weekend, holiday, or the scheduler fired too late). Skipping without trading."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning title=Could not check the clock::Proceeding anyway; the run will still record a log row."
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the pipeline
        id: run
        if: |
          steps.creds.outputs.has_creds == 'true'
          && (github.event_name != 'schedule' || steps.window.outputs.proceed == 'true')
        env:
          # Which cron fired, if any. Empty for a manual dispatch.
          FIRED_SCHEDULE: ${{ github.event.schedule }}
          # Set by a manual "Run workflow"; empty on a scheduled run.
          DISPATCH_MODE: ${{ inputs.mode }}
          # Optional repository variable (Settings -> Secrets and variables ->
          # Actions -> Variables). Set it to 'analyse' to pause automatic
          # trading without editing this file. Defaults to 'execute'.
          SCHEDULED_MODE: ${{ vars.SCHEDULED_MODE }}
          LLM_PROVIDER: ollama_cloud
          LLM_MODEL: ${{ inputs.model }}
          MAX_LLM_SYMBOLS: ${{ inputs.max_llm_symbols || '12' }}
          AGGRESSION: ${{ inputs.aggression || '0.75' }}
          DEMO_MODE: "false"
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
        run: |
          [ -n "$LLM_MODEL" ] || unset LLM_MODEL

          WANTED="${{ inputs.students || 'all' }}"
          if [ "$WANTED" != "all" ] && [ -n "$WANTED" ]; then
            case ",$WANTED," in
              *",${{ matrix.student }},"*) ;;
              *) echo "::notice::${{ matrix.student }} not selected; skipping."; exit 0 ;;
            esac
          fi

          EXTRA=""
          case "$FIRED_SCHEDULE" in
            "0 14 * * 1-5")  LABEL=morning   ;;
            "25 19 * * 1-5") LABEL=afternoon ;;
            "30 21 * * 1-5") LABEL=snapshot  ;;
            *)               LABEL=manual    ;;
          esac

          if [ "$FIRED_SCHEDULE" = "30 21 * * 1-5" ]; then
            # The end-of-day snapshot: record closing equity, decide nothing,
            # trade nothing, spend no LLM quota.
            RUN_MODE=analyse
            EXTRA="--no-llm"
            echo "::notice::End-of-day snapshot — recording equity only."
          elif [ -n "$DISPATCH_MODE" ]; then
            RUN_MODE="$DISPATCH_MODE"          # a human chose this
          else
            RUN_MODE="${SCHEDULED_MODE:-execute}"
          fi

          # THE EXECUTION GATE, and the only place it is decided: orders are
          # submitted when and only when RUN_MODE=execute, which is the only
          # thing that sets REQUIRE_HUMAN_APPROVAL=false.
          if [ "$RUN_MODE" = "execute" ]; then
            REQUIRE_HUMAN_APPROVAL=false
          else
            REQUIRE_HUMAN_APPROVAL=true
          fi
          export RUN_MODE REQUIRE_HUMAN_APPROVAL

          echo "mode=$RUN_MODE require_human_approval=$REQUIRE_HUMAN_APPROVAL $EXTRA"
          echo "effective_mode=$RUN_MODE" >> "$GITHUB_OUTPUT"

          python scripts/run_trading.py \
            --students "${{ matrix.student }}" \
            --run-label "$LABEL" $EXTRA \
            2>&1 | tee "run-${{ matrix.student }}.log"

      - name: Write the job summary
        if: always() && steps.creds.outputs.has_creds == 'true'
        run: |
          {
            echo "## ${{ matrix.student }}"
            echo ""
            MODE="${{ steps.run.outputs.effective_mode }}"
            echo "- mode: \`${MODE:-skipped}\`"
            echo "- orders auto-submitted: \`$([ "$MODE" = execute ] && echo true || echo false)\`"
            echo "- aggression: \`${{ inputs.aggression || '0.75' }}\`"
            echo ""
            echo '```'
            if [ -f "run-${{ matrix.student }}.log" ]; then
              tail -n 80 "run-${{ matrix.student }}.log"
            else
              echo "(no run log produced)"
            fi
            echo '```'
            echo ""
            if [ -f "trading-logs/${{ matrix.student }}.md" ]; then
              # Print the summary block in full, then the history table's
              # header, its |---| separator and the most recent rows. A plain
              # `head -n` cuts between the header and the separator, and
              # Markdown then renders the header as literal text instead of a
              # table.
              python - "trading-logs/${{ matrix.student }}.md" <<'PY'
          import sys
          from pathlib import Path

          lines = Path(sys.argv[1]).read_text(encoding="utf-8").splitlines()
          marker = "## Daily history"
          if marker in lines:
              cut = lines.index(marker)
              rows = [ln for ln in lines[cut + 1:] if ln.startswith("|")]
              # rows[0] is the column header, rows[1] the |---| separator.
              keep = rows[:2] + rows[2:][-10:]
              if len(rows[2:]) > 10:
                  keep.append("")
                  keep.append(f"_Showing the last 10 of {len(rows[2:])} runs._")
              print("\n".join(lines[:cut + 1] + [""] + keep))
          else:
              print("\n".join(lines))
          PY
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the agent artefacts
        if: always() && steps.creds.outputs.has_creds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: model-run-${{ matrix.student }}-${{ github.run_id }}
          path: |
            model-run/
            run-${{ matrix.student }}.log
          if-no-files-found: warn
          retention-days: 30

      - name: Stash this student's daily log
        if: always() && steps.creds.outputs.has_creds == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: trading-log-${{ matrix.student }}-${{ github.run_id }}
          path: trading-logs/
          if-no-files-found: warn
          retention-days: 7

  commit-logs:
    # A SEPARATE job, after the whole matrix, so the matrix jobs cannot race
    # each other pushing to the same branch.
    name: Commit the daily logs
    needs: analyse
    if: always() && github.event_name != 'pull_request'
    # Shared with the backfill workflow, so the two can never write
    # trading-logs/ at the same time and lose each other's rows.
    concurrency:
      group: trading-logs-write
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Collect each student's log
        uses: actions/download-artifact@v4
        with:
          pattern: trading-log-*-${{ github.run_id }}
          path: incoming
          merge-multiple: true

      - name: Merge the rows into the committed logs
        run: |
          mkdir -p trading-logs
          shopt -s nullglob
          for src in incoming/*.csv; do
            name="$(basename "$src")"
            dest="trading-logs/$name"
            if [ ! -f "$dest" ]; then
              cp "$src" "$dest"
              continue
            fi
            # Append only rows the committed file does not already have, so a
            # re-run cannot duplicate a day.
            tail -n +2 "$src" | while IFS= read -r row; do
              [ -z "$row" ] && continue
              grep -qxF "$row" "$dest" || printf '%s\n' "$row" >> "$dest"
            done
          done
          # Rebuild the Markdown mirrors from the merged CSVs.
          #
          # Three KINDS of CSV live in this directory and each has its own
          # renderer. Handing an alpha or ledger file to the daily-log
          # renderer does not fail -- it writes a daily log full of "n/a"
          # over the real one -- so dispatch on the prefix, never on a glob.
          python - <<'PY'
          import pathlib
          import sys

          sys.path.insert(0, "src")
          from trading_system import alpha_log, daily_log

          for csv in sorted(pathlib.Path("trading-logs").glob("*.csv")):
              name = csv.stem
              if name.startswith("alpha_"):
                  print("rebuilt", alpha_log.write_markdown(name[len("alpha_"):], "trading-logs"))
              elif name.startswith("trades_"):
                  pass  # the ledger is raw data; the alpha log is its summary
              else:
                  print("rebuilt", daily_log.write_markdown(name, "trading-logs"))
          PY
          ls -la trading-logs/ || true

      - name: Regenerate the alpha report
        continue-on-error: true
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY_1 }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY_1 }}
          ALPACA_BASE_URL: https://paper-api.alpaca.markets
          DEMO_MODE: "false"
        run: |
          # Read-only: it prices the trades already in the ledger. Any one
          # student's keys work, since market data is not account-specific.
          # continue-on-error because a missing report must never block the
          # daily logs from being committed.
          python -m pip install --upgrade pip >/dev/null
          pip install --ignore-installed PyYAML -r requirements.txt >/dev/null
          python scripts/alpha_report.py --out analysis/alpha_report.md || \
            echo "::warning title=Alpha report skipped::Could not regenerate it this run."

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add trading-logs/ analysis/ 2>/dev/null || git add trading-logs/
          if git diff --cached --quiet; then
            echo "No daily-log changes to commit."
            exit 0
          fi
          git commit -m "chore(logs): trading logs and alpha report for $(date -u +%Y-%m-%d) [skip ci]"
          # Another run may have pushed while this job was working.
          for attempt in 1 2 3 4; do
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && \
              git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0
            echo "push attempt $attempt failed; retrying"
            sleep $((attempt * 5))
          done
          echo "::error title=Could not push the logs::The run succeeded but the daily logs were not committed. They are still available as workflow artifacts."
          exit 1
